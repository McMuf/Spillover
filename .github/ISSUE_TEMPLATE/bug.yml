name: Bug report
description: Something in the engine, the data pipeline or the website does not work.
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact command, claim file or page. Please do not paste API keys.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit

name: check

# Runs on pull requests (including from forks) with a read-only token and NO secrets.
# Fork code can do anything it likes here, so there is nothing worth stealing.
# Never switch this to `pull_request_target`.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the frozen-file check diffs against the base branch

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: make setup

      - name: Lint, type-check, test, validate
        run: make check

      # Registered claims are frozen and generated outputs are never hand-edited.
      - name: Frozen files untouched
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: uv run spillover check-frozen "origin/${BASE_REF}"

  # The website: types generated from the engine's schemas, unit tests, a production build, and
  # a browser smoke test against the built site. Still read-only and secret-free.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: |
          uv sync
          pnpm --dir web install --frozen-lockfile

      - name: Export the site data from the engine
        run: uv run spillover export-site

      - name: Type-check and unit tests
        run: |
          pnpm --dir web typecheck
          pnpm --dir web test

      - name: Build
        run: pnpm --dir web build

      - name: Install browser for the smoke test
        run: pnpm --dir web exec playwright install --with-deps chromium

      - name: Browser smoke test
        run: pnpm --dir web e2e

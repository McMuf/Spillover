name: register

# When a claim, challenge or replication merges to main, stamp its registered_at / submitted_at. Only trusted code on main runs here;
# no fork code is ever checked out. Commits pushed with GITHUB_TOKEN do not re-trigger workflows.
on:
  push:
    branches: [main]
    paths:
      - "claims/*.yaml"
      - "!claims/_*.yaml"
      - "challenges/*.yaml"
      - "!challenges/_*.yaml"
      - "replications/*.yaml"
      - "!replications/_*.yaml"

permissions:
  contents: write

concurrency:
  group: ledger-writes
  cancel-in-progress: false

jobs:
  register:
    if: github.repository == 'McMuf/Spillover'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the stamping step diffs the push against its parent

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync

      # Stamp ONLY the files this push added. Never "every draft on main": a draft that merely sits
      # there (or an unrelated push that happens to match the path filter) must not be registered,
      # because registration freezes a claim for good.
      - name: Stamp registered_at / submitted_at on what this push added
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if ! [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] || [[ "$BEFORE" =~ ^0+$ ]]; then
            BEFORE="${AFTER}^"
          fi
          added=$(git diff --name-only --diff-filter=A "$BEFORE" "$AFTER" -- claims challenges replications \
            | grep -E '\.yaml$' | grep -Ev '(^|/)_[^/]*$' || true)
          args=()
          while IFS= read -r f; do
            [ -n "$f" ] && args+=(--only "$f")
          done <<< "$added"
          if [ ${#args[@]} -eq 0 ]; then
            echo "this push added no claim, challenge or replication"
            exit 0
          fi
          uv run spillover register "${args[@]}"

      - name: Commit registration
        run: |
          if git diff --quiet -- claims challenges replications; then
            echo "nothing new to stamp"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add claims challenges replications
          git commit -s -m "chore: stamp registrations and submissions (CI sets the time)"
          git push

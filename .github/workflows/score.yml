name: score

# Grades prediction windows that have closed against real prices, then rebuilds the scoreboard.
# Same switch as ingest.yml: it does nothing unless the repository variable INGEST_ENABLED is
# "true" and the FRED_API_KEY secret exists. Real prices are fetched into the runner and only the
# derived outcome records and scoreboard data are committed.
on:
  schedule:
    - cron: "37 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ledger-writes
  cancel-in-progress: false

jobs:
  score:
    if: github.repository == 'McMuf/Spillover' && vars.INGEST_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync

      - name: Verify the ledger
        run: |
          uv run spillover verify-ledger
          uv run spillover verify-outcomes

      - name: Fetch prices (derived returns only, not committed)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: uv run spillover ingest --config data/sources.ci.toml

      - name: Grade closed windows
        run: uv run spillover grade --data data/cache

      # A replication is a config; the engine runs it and writes the hashed result. People never do.
      - name: Run pending replications
        run: uv run spillover replicate --data data/cache

      - name: Rebuild the scoreboard
        run: |
          uv run spillover verify-outcomes
          uv run spillover scoreboard

      - name: Commit outcomes and scoreboard
        run: |
          # Only paths that exist: git stops with a fatal error on a path that matches nothing
          # (replications/results appears only after the first replication runs).
          for p in outcomes scoreboard replications/results; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "nothing new"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -s -m "chore: grade closed windows, run replications, update the scoreboard"
          git pull --rebase --autostash origin main
          git push

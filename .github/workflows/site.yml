name: site

# Builds the static site from the engine's output and deploys it to GitHub Pages.
# One-time setup: repository Settings > Pages > Build and deployment > Source: GitHub Actions.
#
# With INGEST_ENABLED on, the site shows REAL results: it builds the price cache from FRED first
# (derived returns only, never committed or published as prices). Otherwise it shows the synthetic
# demo data, with the banner that says so.
on:
  push:
    branches: [main]
  # Daily refresh after the weekday scoring job. Commits the bot pushes (new predictions, grades)
  # do not trigger workflows, so without this the site would not show them.
  # Hourly as well, so the News tab always carries the last hour of headlines (GitHub may run a
  # scheduled job late; the browser also fetches live news between builds).
  schedule:
    - cron: "15 23 * * 1-5"
    - cron: "40 * * * *"
  # Rebuild as soon as an ingest run finishes, so new headlines, predictions and proofs show up
  # without waiting for the evening rebuild. ingest only ever runs on main (schedule or manual),
  # never on pull requests, so this never builds untrusted code.
  workflow_run:
    workflows: [ingest]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'McMuf/Spillover'
    # configure-pages reads the Pages settings, so it needs pages: write; nothing here may mint tokens.
    # discussions: read lets the export step list questions and comment counts; it cannot post.
    permissions:
      contents: read
      pages: write
      discussions: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install the engine
        run: uv sync

      # Real data first, and before any npm package is installed: nothing from the JavaScript
      # toolchain has run yet, so it cannot tamper with the step that holds the FRED key.
      - name: Build the real price cache (derived returns only)
        id: cache
        if: ${{ vars.INGEST_ENABLED == 'true' }}
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: uv run spillover ingest --config data/sources.ci.toml

      # The last good GDELT headlines, reused when GDELT rate-limits this runner's address. A cache,
      # not a commit: nothing about headlines is ever written to the repository.
      - name: Restore the previous build's headlines
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/headlines.json
          key: gdelt-headlines-${{ github.run_id }}
          restore-keys: gdelt-headlines-

      # Real icons for news outlets, companies and contributors, kept between builds so only new
      # names are looked up. A cache, not a commit: icons are never written to the repository.
      - name: Restore the previous build's icons
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/icons
          key: site-icons-${{ github.run_id }}
          restore-keys: site-icons-

      # The workflow's own token, read-only, given to this one step (before any npm package runs).
      - name: Export the site data from the engine
        env:
          SPILLOVER_DATA: ${{ steps.cache.outcome == 'success' && 'data/cache' || 'fixtures/synthetic' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run spillover export-site --live-headlines --discussions --icons

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install the website toolchain
        run: pnpm --dir web install --frozen-lockfile

      - name: Build
        run: pnpm --dir web build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job may publish: the build job (which runs pnpm install) cannot.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

id: clm_acquisition_announced_crwd_up_v1

statement: >
  When an acquisition is announced, CRWD rises within a week.

event_type: ACQUISITION_ANNOUNCED
trigger_entities: [CRWD, ZS]

instrument: {venue: us_equity, symbol: CRWD}

window: {start: first_report, end: +4_trading_days}
expected_sign: positive

baseline: factor_only

success: {spillover_ci_excludes_zero: true, min_forward_events: 8}

falsifier: >
  After 8 new events, CRWD's average abnormal move is not clearly above zero (the 95% interval includes zero or lies on the other side).

registered_by: McMuf
registered_at: set_by_ci_on_merge

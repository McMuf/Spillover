# Seed claim 4 (control): many events, validates the engine before anything else is tested.
id: clm_fomc_abs_move_spx_v1

statement: >
  On FOMC decision days, the S&P 500 makes a larger absolute move over the day and the next
  trading day than its trailing volatility predicts.

event_type: FOMC_DECISION
trigger_entities: [FED]

# The S&P 500 is itself the market, so there is no separate factor to control for.
instrument: {venue: us_index, symbol: SPX}

window: {start: first_report, end: +1_trading_day}
expected_sign: positive

# constant_mean: the baseline is the instrument's own trailing average return.
baseline: constant_mean
# Tests |CAR| minus the typical |CAR| of same-length windows in the estimation period.
measure: abs_excess_return

success: {spillover_ci_excludes_zero: true, min_forward_events: 8}

falsifier: >
  The interval for the excess absolute move includes zero or is negative after at least 8
  forward FOMC decisions.

registered_by: McMuf
registered_at: set_by_ci_on_merge

# Starter claim: Fed rate-decision days move the dollar more than usual.
id: clm_fomc_abs_move_usd_v1

statement: >
  On FOMC decision days, the broad US dollar index makes a larger absolute move over the day and
  the next trading day than its trailing volatility predicts.

event_type: FOMC_DECISION
trigger_entities: [FED]

# Nominal Broad US Dollar Index (FRED DTWEXBGS, Federal Reserve, public domain).
instrument: {venue: fx, symbol: USD}

window: {start: first_report, end: +1_trading_day}
expected_sign: positive

# The dollar index has no separate market factor here: compare it with its own normal movement.
baseline: constant_mean
measure: abs_excess_return

success: {spillover_ci_excludes_zero: true, min_forward_events: 8}

falsifier: >
  The interval for the excess absolute move of the dollar index includes zero or is negative after
  at least 8 forward FOMC decisions.


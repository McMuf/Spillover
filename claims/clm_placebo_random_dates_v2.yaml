# Seed claim 6, version 2 (placebo): random dates must show nothing. If this ever "works", the
# engine is broken.
#
# Why v2: v1 trades XLK, which the scheduled scoring job has no price source for, so v1 could
# never be graded. v1 stays on record, frozen as registered. v2 trades the Nasdaq Composite
# against the S&P 500, and both come from FRED (see data/sources.ci.toml).
id: clm_placebo_random_dates_v2

statement: >
  On randomly chosen dates, the Nasdaq Composite earns an abnormal return above what the S&P 500
  explains over the day and the next trading day.

event_type: RANDOM_DATE
trigger_entities: [NONE]

# The Nasdaq Composite is not the S&P 500, so the factor (the S&P 500) leaves something to measure.
instrument: {venue: us_index, symbol: NASDAQ}

window: {start: first_report, end: +1_trading_day}
expected_sign: positive

baseline: factor_only
factor: MKT

success: {spillover_ci_excludes_zero: true, min_forward_events: 8}

falsifier: >
  The interval for the mean abnormal return includes zero, which is the expected outcome for a
  placebo. A significant result means the pipeline has a bug.

registered_by: McMuf
# CI stamps this when the file merges to main. Leave it as shown.
registered_at: set_by_ci_on_merge

# The configuration the scheduled GitHub workflows (ingest.yml, score.yml) use. No secrets here:
# FRED_API_KEY, ALPHAVANTAGE_API_KEY, ANTHROPIC_API_KEY and SEC_CONTACT come from repository secrets.
#
# REVIEW BEFORE TURNING THE WORKFLOWS ON (repository variable INGEST_ENABLED=true):
#  - FRED's S&P 500 series carries its own copyright notice from S&P. Check that you may use it
#    this way, or replace it with a source whose terms you have read.
#  - Only derived daily returns are used, in the runner. No price file is ever committed.

[data]
out = "data/cache"
start = "2017-01-01"  # FRED's S&P 500 series covers the last ten years

[[series]]
symbol = "SPX"
provider = "fred"
id = "SP500"

[[series]]
symbol = "MKT"
provider = "alias"
of = "SPX"

# The Nasdaq Composite: the instrument of the placebo claim (clm_placebo_random_dates_v2), measured
# against the S&P 500 above. FRED's NASDAQCOM series carries its own copyright notice (NASDAQ OMX),
# like the S&P 500 series: check that you may use it this way before turning ingestion on.
[[series]]
symbol = "NASDAQ"
provider = "fred"
id = "NASDAQCOM"

# Public-domain series from US government agencies ("public domain: citation requested" on FRED).
# Source credit is shown in the site footer and the README.
[[series]]
symbol = "USD"
provider = "fred"
id = "DTWEXBGS"  # Nominal Broad US Dollar Index, Board of Governors of the Federal Reserve System

[[series]]
symbol = "USDJPY"
provider = "fred"
id = "DEXJPUS"  # Japanese yen per US dollar, Board of Governors of the Federal Reserve System

# WTI crude (FRED DCOILWTICO) is left out on purpose: its spot price was negative on 2020-04-20, and a
# return is undefined across a non-positive price. The engine refuses it rather than fake a number.
# No claim uses oil. Add Brent (DCOILBRENTEU, positive throughout) if an oil claim is ever proposed.

# --- Single stocks (Tiingo, adjusted daily closes) -------------------------------------------------
# On: the repository secret TIINGO_API_KEY is set. Split- and dividend-adjusted daily closes from
# Tiingo's free plan (up to 500 different tickers a month, 50 an hour, 1,000 requests a day). Every
# scheduled run fetches each ticker once, so keep this list short: 11 tickers x about 33 runs a day
# is about 360 requests. Only derived statistics are published, never prices. A stock that fails to
# load is skipped, never fatal.

[[series]]
symbol = "NVDA"  # Nvidia
provider = "tiingo"
id = "NVDA"

[[series]]
symbol = "MU"    # Micron
provider = "tiingo"
id = "MU"

[[series]]
symbol = "GOOGL" # Alphabet
provider = "tiingo"
id = "GOOGL"

[[series]]
symbol = "AMZN"  # Amazon
provider = "tiingo"
id = "AMZN"

[[series]]
symbol = "MSFT"  # Microsoft
provider = "tiingo"
id = "MSFT"

[[series]]
symbol = "TSM"   # TSMC
provider = "tiingo"
id = "TSM"

[[series]]
symbol = "AMD"   # AMD
provider = "tiingo"
id = "AMD"

[[series]]
symbol = "AAPL"  # Apple
provider = "tiingo"
id = "AAPL"

[[series]]
symbol = "META"  # Meta
provider = "tiingo"
id = "META"

[[series]]
symbol = "DAL"   # Delta Air Lines
provider = "tiingo"
id = "DAL"

[[series]]
symbol = "CRWD"  # CrowdStrike (clm_acquisition_announced_crwd_up_v1)
provider = "tiingo"
id = "CRWD"

# --- Single stocks (Alpha Vantage, adjusted daily closes) -----------------------------------------
# Off until the repository secret ALPHAVANTAGE_API_KEY exists. Its free tier (25 requests a day,
# 100 days of history) is too small: the engine needs about 130 trading days before each event, and
# the scheduled runs fetch every series several times a day. The key to use is one from Alpha
# Vantage's program for open-source and educational projects. Their terms allow personal,
# non-commercial research use; only derived statistics are published, never prices.
# Uncomment a block once that key is set. A stock that fails to load is skipped, never fatal.
#
# [[series]]
# symbol = "DAL"   # Delta Air Lines
# provider = "alphavantage"
# id = "DAL"
#
# [[series]]
# symbol = "CRWD"  # CrowdStrike
# provider = "alphavantage"
# id = "CRWD"

[[events]]
type = "fomc"

# Scheduled US macro releases, from FRED's release calendar (same key; BLS blocks scripts).
[[events]]
type = "fred_release"
release_id = 10  # Consumer Price Index
event_type = "CPI_RELEASE"
entity = "BLS"

[[events]]
type = "fred_release"
release_id = 50  # Employment Situation (the jobs report)
event_type = "JOBS_REPORT"
entity = "BLS"

# Big technology listings (IPOs and direct listings), from a reviewed list: one row per listing,
# each with a source. New listings are added by pull request on or before their first trading day.
[[events]]
type = "csv"
path = "labels/mega_tech_ipos.csv"

[[events]]
type = "store"
path = "events"
confirmed = "labels/confirmed.txt"

# Pre-registered random dates for the permanent placebo claim. `spillover placebo-events` draws
# whole future months once, in advance, and never rewrites a month (so no hindsight).
[[events]]
type = "placebo"
path = "events/placebo"

[[headlines]]
name = "fed-press"
url = "https://www.federalreserve.gov/feeds/press_all.xml"
terms = "US federal government work, public domain (17 U.S.C. 105)"

[[headlines]]
name = "sec-press"
url = "https://www.sec.gov/news/pressreleases.rss"
terms = "US federal government work, public domain; SEC asks automated clients to stay under 10 requests per second and to identify themselves"

# Company events from SEC 8-K filings, typed by item number (no labeler). Runs only when the
# SEC_CONTACT repository variable holds a contact email, which SEC requires of automated tools.
[[filings]]
terms = "US federal government work, public domain; SEC asks automated clients to declare a contact email and stay under 10 requests per second"

[extractor]
# "rules" is free: phrase rules plus the committed company list (labels/companies.json). Switch to
# "claude" (and add ANTHROPIC_API_KEY plus credit) for the more capable, paid labeler.
engine = "rules"
model = "claude-haiku-5-5"
store = "events"
cache = "events/extractions"
max_new_per_run = 100

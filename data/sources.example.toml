# Copy to data/sources.toml and edit. data/sources.toml and everything else under data/ is
# git-ignored: this file holds no secrets (keys come from the environment), and the cache holds
# derived returns only. Paths are relative to where you run the command.
#
# Run:  export FRED_API_KEY=...   (free key at https://fred.stlouisfed.org/docs/api/api_key.html)
#       uv run spillover ingest
# Then: uv run spillover test-claim claims/clm_fomc_abs_move_spx_v1.yaml --data data/cache
#
# READ EACH PROVIDER'S TERMS before using it. Spillover stores only derived daily returns (never
# vendor price files) and keeps them out of version control by default, but whether you may use a
# provider's data this way, or publish results derived from it, is for you to check. Some FRED
# series carry their own copyright notices (the S&P 500 series does, among others).

[data]
out = "data/cache"
start = "2021-01-01"
# A single-day move larger than this is rejected as a probable data error (unadjusted split).
max_abs_return = 0.5

# Prices from FRED (bring your own key). Any FRED series of daily levels works.
[[series]]
symbol = "SPX"
provider = "fred"
id = "SP500"

# Prices from a CSV you exported yourself from any vendor: a Date column (YYYY-MM-DD) and one
# of Adj Close / Close / Price. Use dividend- and split-adjusted prices for ETFs and stocks.
# [[series]]
# symbol = "XLK"
# provider = "csv"
# path = "data/raw/XLK.csv"

# The market factor that factor-only baselines control for. Here: the S&P 500 itself.
[[series]]
symbol = "MKT"
provider = "alias"
of = "SPX"

# Built in: FOMC decision dates from the Federal Reserve's public calendar (US government work).
[[events]]
type = "fomc"

# Your own events: columns event_id,event_type,entity,date,scheduled,source (source is required;
# event_type is UPPER_SNAKE_CASE).
# [[events]]
# type = "csv"
# path = "data/raw/events.csv"

# Events extracted from headlines (see [[headlines]] below), read from the committed events/ store.
# Low-confidence extractions are excluded until a person lists their event_key in
# labels/confirmed.txt.
[[events]]
type = "store"

# --- Headlines -> events ----------------------------------------------------------------------
# `uv run spillover ingest-headlines` fetches these feeds and keeps only each item's title, link,
# source name, id and publication time (never article text). `terms` is required: say why you may
# use the feed. Only official feeds are listed; add others only after reading their terms.
# The extractor needs your own ANTHROPIC_API_KEY (uv sync --group llm); without one, it only
# replays answers already in the committed cache and never guesses.
#
# Note: official regulator feeds mostly carry regulatory news, so expect few company events
# (earnings, guidance) from them. The feed list decides how useful the event stream is.

[[headlines]]
name = "fed-press"
url = "https://www.federalreserve.gov/feeds/press_all.xml"
terms = "US federal government work, public domain (17 U.S.C. 105)"

[[headlines]]
name = "sec-press"
url = "https://www.sec.gov/news/pressreleases.rss"
terms = "US federal government work, public domain; SEC asks automated clients to stay under 10 requests per second and to identify themselves"

[extractor]
model = "claude-haiku-5-5"
store = "events"
cache = "events/extractions"
# A cost cap: at most this many NEW headlines are sent to the model per run.
max_new_per_run = 100
